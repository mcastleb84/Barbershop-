<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Up</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <style>
    body { font-family: -apple-system, sans-serif; max-width: 360px; margin: 40px auto; padding: 0 16px; }
    h1 { text-align: center; }
    input, button { width: 100%; padding: 12px; margin: 8px 0; font-size: 16px; box-sizing: border-box; border-radius: 8px; }
    input { border: 1px solid #ccc; }
    button { background: #111; color: #fff; border: none; cursor: pointer; }
    button:disabled { opacity: 0.5; }
    #message { text-align: center; margin-top: 12px; }
    .error { color: #c00; }
    .success { color: #080; }
  </style>
</head>
<body>
  <h1>Create an account</h1>

  <form id="signup-form">
    <input type="email" id="email" placeholder="Email" required>
    <input type="password" id="password" placeholder="Password (6+ characters)" minlength="6" required>
    <button type="submit" id="submit-btn">Sign up</button>
  </form>

  <p id="message">Page ready (v2)</p>
  <p style="text-align:center">Already have an account? <a href="login.html">Log in</a></p>

  <script>
    const message = document.getElementById('message');

    function showError(text) {
      message.textContent = 'Error: ' + text;
      message.className = 'error';
    }

    window.addEventListener('error', (e) => showError(e.message));

    let sb;
    try {
      const config = window.BARBERSHOP_CONFIG;
      if (!config) throw new Error('config.js did not load');
      if (!window.supabase) throw new Error('Supabase library did not load');
      sb = window.supabase.createClient(config.SUPABASE_URL, config.SUPABASE_ANON_KEY);
    } catch (err) {
      showError(err.message);
    }

    const form = document.getElementById('signup-form');
    const button = document.getElementById('submit-btn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!sb) { showError('Not connected to Supabase'); return; }

      button.disabled = true;
      message.textContent = 'Creating account...';
      message.className = '';

      try {
        const email = document.getElementById('email').value.trim();
        const password = document.getElementById('password').value;

        const { data, error } = await sb.auth.signUp({
          email,
          password,
          options: {
            emailRedirectTo: 'https://mcastleb84.github.io/Barbershop-/login.html'
          }
        });

        if (error) { showError(error.message); return; }

        if (data.session) {
          message.textContent = 'Account created! Redirecting...';
          message.className = 'success';
          setTimeout(() => { window.location.href = 'index.html'; }, 1000);
        } else {
          message.textContent = 'Check your email to confirm your account.';
          message.className = 'success';
          form.reset();
        }
      } catch (err) {
        showError(err.message);
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
